name: freelance
description: "Ngooli apps helping find competent handyman"
publish_to: "none"
version: 0.1.0

environment:
    sdk: ">=3.3.2 <4.0.0"

dependencies:
    cloud_firestore: ^5.4.4
    firebase_auth: ^5.3.1
    firebase_core: ^3.6.0
    flutter:
        sdk: flutter
    flutter_dotenv: ^5.2.1
    flutter_svg: ^2.0.14
    form_validator: ^2.1.1
    geocoding: ^3.0.0
    geolocator: ^13.0.2
    google_sign_in: ^6.2.1
    googleapis: ^13.2.0
    googleapis_auth: ^1.6.0
    http: ^1.2.2
    image_picker: ^1.1.2
    intl: ^0.19.0
    midtrans_sdk: ^0.4.0
    provider: ^6.1.2
    shared_preferences: ^2.3.2
    skeletonizer: ^1.4.2
    smooth_page_indicator: ^1.2.0+3

dev_dependencies:
    flutter_lints: ^4.0.0
    flutter_test:
        sdk: flutter

flutter:
    uses-material-design: true
    assets:
        - assets/images/
        - assets/svg/
        - assets/icon/icon.png
        - assets/images/launcher_icon.png
        - .env
        - assets/service_account.json
